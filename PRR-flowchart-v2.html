<rect x="198" y="396" width="140" height="26" rx="5" fill="#3a8a5a" stroke="#5ab87a" stroke-width="1.3"/>

<text x="268" y="480" font-size="9" fill="#e8c850" text-anchor="middle" font-weight="600">γ × enhanced</text>

<text x="30" y="650" font-size="8.5" fill="#aaa">cat[x, heatmap] → Conv3×3+BN+SiLU → Conv1×1 → offset (B,2,H,W)</text>
<text x="30" y="663" font-size="8.5" fill="#aaa">base_grid + offset×0.1×heatmap → clamp(-1,1) → grid_sample(x) → resampled</text>
<text x="30" y="676" font-size="8.5" fill="#aaa">resampled → Conv1×1+BN+SiLU → enhanced     Output = x + γ·enhanced</text>
